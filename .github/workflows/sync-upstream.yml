name: Sync upstream main

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Asia/Jerusalem' # 09:00 Israel time daily; follows DST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'lmn451/chrome-devtools-mcp' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      conflict_files: ${{ steps.merge.outputs.conflict_files }}
    steps:
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main into fork main
        id: merge
        run: |
          git remote add upstream https://github.com/ChromeDevTools/chrome-devtools-mcp.git
          git fetch --no-tags upstream main
          # Merge to preserve fork-only commits, including PR #3.
          if ! git merge --no-edit FETCH_HEAD; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflicts" ]]; then
              echo "Merge failed without conflicted paths." >&2
              exit 1
            fi
            conflicts_json="$(printf '%s\n' "$conflicts" | jq -Rsc 'split("\n") | map(select(length > 0))')"
            echo "conflict_files=$conflicts_json" >> "$GITHUB_OUTPUT"
            echo "::warning title=Upstream sync conflict::Manual review required"
            exit 0
          fi
          git push origin HEAD:refs/heads/main

  report-conflict:
    name: Report upstream merge conflict
    needs: sync
    if: ${{ needs.sync.outputs.conflict_files != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish conflict report
        env:
          CONFLICT_FILES_JSON: ${{ needs.sync.outputs.conflict_files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '## Upstream sync conflict — manual review required'
            echo
            echo 'The sync did not push changes. Resolve the conflict, then rerun the sync.'
            echo
            echo 'Conflicting paths:'
            echo
            echo '```json'
            printf '%s\n' "$CONFLICT_FILES_JSON"
            echo '```'
            echo
            echo "[View workflow run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Upstream sync conflict::Manual resolution required; see the job summary."
          exit 1
